name: Analisi Over/Under 2.5

on:
  schedule:
    # Ogni giovedì alle 06:00 UTC (08:00 in Italia d'estate, 07:00 d'inverno).
    # GitHub usa sempre UTC e può ritardare i job schedulati nei momenti di picco.
    - cron: "0 6 * * 4"
  workflow_dispatch: # permette l'avvio manuale dalla tab Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Evita esecuzioni sovrapposte; non annulla una pubblicazione già in corso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa le dipendenze
        run: pip install pandas certifi

      - name: Genera l'analisi
        run: |
          mkdir -p public
          python analisi_over_under.py --output public/index.html

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica l'artefatto
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
